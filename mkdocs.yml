
site_name: Yifan's AI Infra Notes
site_url: https://YifanLi3.github.io/

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - content.code.copy
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Light mode

nav:
  - 首页: index.md
  - 基础知识:
      - Arithmetic Intensity: fundamentals/arithmetic-intensity.md
      - Continuous Batching: fundamentals/Continuous-Batching.md
      - PagedAttention: fundamentals/paged-attention.md
      - KV Cache: fundamentals/kv-cache.md

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
